<!DOCTYPE html>
<html><head><title>AI HR Recruitment Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="container">
<h1>AI HR Recruitment Assistant</h1>
<p>AI-powered recruitment management system</p>

<section><h2>Upload Resume</h2>
<form action="/upload-resume" method="POST" enctype="multipart/form-data">
<input type="file" name="resume" accept=".pdf" required>
<button>Analyze Resume</button></form></section>

<section><h2>Create Job</h2>
<form action="/add-job" method="POST">
<input name="title" placeholder="Job Title" required>
<textarea name="description" placeholder="Job Description" required></textarea>
<input name="skills" placeholder="Python, SQL, Machine Learning" required>
<input name="experience" placeholder="Required experience in years" required>
<button>Create Job</button></form></section>

<section><h2>Recruitment Tools</h2>
<a href="/candidates">Candidate List</a><br><br>
<a href="/dashboard">Recruitment Dashboard</a></section>
</div></body></html>
